services:
  backend:
    build: ./backend
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
    volumes:
      - drawings-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  drawings-data:
